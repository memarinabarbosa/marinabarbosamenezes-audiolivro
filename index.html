<style>
:root{color-scheme:light;--bg:#fff;--fg:#111;--mut:#777;--line:#e6e6e6;--card:#fff;--acc:#111;--accfg:#fff;--hl:#ffe066;--hlfg:#111;--hv:#f1f1f1;
box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){color-scheme:dark;--bg:#121212;--fg:#ececec;--mut:#8a8a8a;--line:#2a2a2a;--card:#1c1c1c;--acc:#ececec;--accfg:#121212;--hl:#8a6d00;--hlfg:#fff;--hv:#242424}}
:root[data-theme="dark"]{color-scheme:dark;--bg:#121212;--fg:#ececec;--mut:#8a8a8a;--line:#2a2a2a;--card:#1c1c1c;--acc:#ececec;--accfg:#121212;--hl:#8a6d00;--hlfg:#fff;--hv:#242424}
html{height:100%;scroll-padding-top:env(safe-area-inset-top,0px)}
body{height:100%;margin:0;display:flex;flex-direction:column;background:var(--bg);color:var(--fg);font:16px/1.5 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}
button,select,input{font:inherit;color:inherit}
header{position:relative;display:flex;align-items:center;justify-content:space-between;gap:1rem;padding:.6rem .9rem;min-height:3rem}
#ttl{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;font-weight:600}
.tg{display:inline-flex;border:1px solid var(--line);border-radius:999px;padding:2px}
.tg button{border:0;background:none;width:2rem;height:2rem;border-radius:50%;display:grid;place-items:center;cursor:pointer;color:var(--mut)}
.tg button.on{background:var(--acc);color:var(--accfg)}
.ib{border:0;background:none;width:2.4rem;height:2.4rem;border-radius:50%;display:grid;place-items:center;cursor:pointer}
.ib:hover,button.mi:hover{background:var(--hv)}
#menu{position:absolute;right:.8rem;top:100%;z-index:5;background:var(--card);border:1px solid var(--line);border-radius:12px;padding:.3rem;min-width:15rem;box-shadow:0 6px 24px rgba(0,0,0,.14)}
.mi{display:flex;width:100%;box-sizing:border-box;align-items:center;justify-content:space-between;gap:1rem;border:0;background:none;text-align:left;padding:.65rem .7rem;border-radius:8px;font-size:.95rem}
button.mi{cursor:pointer}
#home{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:1.2rem;padding:1.5rem}
h1{margin:0;font-size:1.5rem;font-weight:500}
#drop{display:block;box-sizing:border-box;width:min(24rem,100%);text-align:center;cursor:pointer;border:1.5px dashed var(--line);border-radius:12px;padding:2.6rem 1.5rem}
#drop.over,#drop:hover{border-color:var(--fg)}
#drop b{display:block;font-weight:500}
#drop span,.note{color:var(--mut);font-size:.9rem}
#msg{min-height:1.4em;margin:0;color:var(--mut);text-align:center}
#info{flex:1;display:flex;align-items:center;justify-content:center;padding:1rem}
.bk{display:flex;gap:2.5rem;align-items:flex-start;flex-wrap:wrap;justify-content:center;max-width:44rem}
.cv{width:12rem;aspect-ratio:2/3;border-radius:6px;overflow:hidden;background:var(--hv);display:grid;place-items:center;text-align:center;padding:.5rem;box-sizing:border-box;box-shadow:0 4px 18px rgba(0,0,0,.18)}
.cv img{width:100%;height:100%;object-fit:cover;display:block;margin:-.5rem}
.dt{flex:1;min-width:14rem;max-width:22rem}
.dt h2{margin:0;font-size:1.5rem;line-height:1.25}
dl{display:grid;grid-template-columns:auto 1fr;gap:.4rem 1rem;margin:1.2rem 0;font-size:.95rem}
dt{color:var(--mut)}dd{margin:0}
.btn{border:0;border-radius:10px;background:var(--acc);color:var(--accfg);padding:.7rem 1.4rem;cursor:pointer}
.lnk{border:0;background:none;color:var(--mut);cursor:pointer;padding:.3rem 0;font-size:.9rem}
#ft{display:flex;align-items:center;justify-content:center;gap:.45rem;padding:1.1rem;color:var(--mut);font-size:.9rem}
#reader{flex:1;display:flex;flex-direction:column;min-height:0}
#text{flex:1;overflow:auto;padding:1rem 1.2rem 2rem;font:1.2rem/1.8 "Iowan Old Style","Palatino Linotype",Palatino,Georgia,serif;-webkit-overflow-scrolling:touch}
#page{max-width:36rem;margin:0 auto}
#page p{margin:0 0 1.15em}
.pg{margin:1.8em 0 1em;padding-top:.5em;border-top:1px solid var(--line);font:.78rem system-ui,sans-serif;color:var(--mut)}
.w{cursor:pointer;border-radius:3px}
.w:hover{background:var(--hv)}
.w.on{background:var(--hl);color:var(--hlfg)}
.sn{display:flex;justify-content:space-between;margin-top:2rem}
.sn button{border:0;background:none;color:var(--mut);cursor:pointer;padding:.4rem 0}
#bar{padding:.2rem 1.2rem .8rem}
.row{display:flex;align-items:center;justify-content:center;gap:1rem;max-width:36rem;margin:0 auto}
#seek{flex:1;min-width:0;accent-color:var(--acc);height:1.4rem}
#pginfo{display:block;margin:0 auto;font-size:.82rem}
.ctl{width:3rem;height:3rem;border:0;border-radius:50%;background:none;font-size:1.3rem;cursor:pointer}
.ctl:hover{background:var(--hv)}
#play{width:3.6rem;height:3.6rem;background:var(--acc);color:var(--accfg);font-size:1.4rem}
.opts{gap:.6rem}
.opts select{border:1px solid var(--line);border-radius:8px;background:var(--bg);padding:.45rem;min-width:0}
#voice{flex:1}
#err{text-align:center;margin:0 auto .4rem}
dialog{border:0;border-radius:16px;background:var(--card);color:var(--fg);padding:1.1rem;width:min(30rem,calc(100% - 1.5rem));max-height:82vh;overflow:auto}
dialog::backdrop{background:rgba(0,0,0,.45)}
.dh{display:flex;align-items:center;justify-content:space-between;margin-bottom:.8rem}
.dh h2{font-size:1rem;margin:0;font-weight:600}
.go{display:flex;gap:.5rem;margin-bottom:.8rem}
.go input{flex:1;min-width:0;border:1px solid var(--line);border-radius:10px;background:var(--bg);padding:.5rem .7rem}
.go .btn{padding:.5rem 1rem}
#grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(3.2rem,1fr));gap:.4rem;max-height:48vh;overflow:auto}
#grid button{border:1px solid var(--line);background:none;border-radius:8px;padding:.5rem 0;font-size:.9rem;cursor:pointer}
#grid .cur{background:var(--acc);color:var(--accfg);border-color:var(--acc)}
#chl button{display:block;width:100%;text-align:left;border:0;border-bottom:1px solid var(--line);background:none;padding:.7rem .6rem;cursor:pointer;font-size:.95rem}
#chl button:hover{background:var(--hv)}
button:focus-visible,select:focus-visible,input:focus-visible{outline:3px solid var(--acc);outline-offset:2px}
[hidden]{display:none!important}
</style>
</head>
<body>
<header>
  <span id="ttl"></span>
  <div class="tg" id="tg1"></div>
  <button class="ib" id="more" aria-label="Mais opções" hidden><svg viewBox="0 0 24 24" width="20" height="20" fill="currentColor"><circle cx="12" cy="5" r="2"/><circle cx="12" cy="12" r="2"/><circle cx="12" cy="19" r="2"/></svg></button>
  <div id="menu" hidden>
    <div class="mi"><span>Tema</span><div class="tg" id="tg2"></div></div>
    <button class="mi" id="mcap">Capítulos</button>
    <button class="mi" id="mpg">Página</button>
    <button class="mi" id="mawake">Manter tela acesa: não</button>
    <button class="mi" id="newbk">Trocar de livro</button>
  </div>
</header>

<main id="home">
  <h1>Envie seu arquivo</h1>
  <label id="drop"><input type="file" id="file" accept=".pdf,.epub,application/pdf,application/epub+zip" hidden>
    <b>Escolher um arquivo</b><span>PDF ou EPUB, ou arraste até aqui</span></label>
  <p id="msg" role="status"></p>
</main>

<main id="info" hidden></main>

    <div class="row"><input type="range" id="seek" min="0" value="0" aria-label="Posição no livro"></div>
    <button class="lnk" id="pginfo"></button>
    <div class="row">
      <button class="ctl" id="prev" aria-label="Parágrafo anterior">⏮</button>
      <button class="ctl" id="play" aria-label="Ouvir">▶</button>

/* ---------- leitura dos arquivos ---------- */

    await pg.render({canvasContext:c.getContext('2d'),viewport:vp}).promise;cover=c.toDataURL('image/jpeg',.8)}catch(e){}

      if(dest&&dest[0]!=null){const pi=typeof dest[0]==='object'?await pdf.getPageIndex(dest[0]):dest[0];chs.push({t:(it.title||'').trim(),d,page:pi+1})}

}
async function readEpub(buf){
  const z=await JSZip.loadAsync(buf),dp=new DOMParser(),rd=p=>z.file(p)?z.file(p).async('string'):Promise.resolve('');

/* ---------- modelo do texto ---------- */
function build(list){
  words=[];paras=[];
  for(const t of list){const w=t.split(/\s+/).filter(Boolean);if(!w.length)continue;paras.push({s:words.length,e:words.length+w.length});for(const x of w)words.push(x)}
  pe=new Set(paras.map(p=>p.e));secs=[];let s=0;
  for(let i=0;i<paras.length;i++)if(paras[i].e-paras[s].s>1200||i===paras.length-1){secs.push({p0:s,p1:i});s=i+1}
  curSec=-1;
}
const secOf=i=>secs.findIndex(s=>i<paras[s.p1].e);
function renderSec(k){
  curSec=k;const s=secs[k];let h='';
  for(let p=s.p0;p<=s.p1;p++){
    if(pgAt.has(p))h+='<div class="pg">Página '+pages[pgAt.get(p)].n+'</div>';
    h+='<p>';for(let i=paras[p].s;i<paras[p].e;i++)h+='<span class="w" data-i="'+i+'">'+esc(words[i])+'</span> ';h+='</p>'}
  h+='<div class="sn"><button data-s="'+(k-1)+'"'+(k?'':' hidden')+'>← Anterior</button><button data-s="'+(k+1)+'"'+(k<secs.length-1?'':' hidden')+'>Próxima →</button></div>';
  $('#page').innerHTML=h;$('#text').scrollTop=0;
}
function pgIdx(i){let lo=0,hi=pgW.length-1,r=0;while(lo<=hi){const m=(lo+hi)>>1;if(pgW[m]<=i){r=m;lo=m+1}else hi=m-1}return r}
function updPg(i){
  if(!pgW.length)return;const k=pgIdx(i);if(k===curPg)return;curPg=k;
  $('#pginfo').textContent='Página '+pages[k].n+' de '+pages[pages.length-1].n;
  const g=$('#grid'),o=g.querySelector('.cur');if(o)o.classList.remove('cur');if(g.children[k])g.children[k].classList.add('cur');
}
function mark(i){
  if(i<0||i>=words.length)return;const k=secOf(i);if(k!==curSec)renderSec(k);
  const o=$('#page .on');if(o)o.classList.remove('on');
  const s=$('#page [data-i="'+i+'"]');
  if(s){s.classList.add('on');const r=s.getBoundingClientRect(),t=$('#text').getBoundingClientRect();if(r.top<t.top+30||r.bottom>t.bottom-30)s.scrollIntoView({block:'center',behavior:'smooth'})}
  $('#seek').value=i;updPg(i);
}

/* ---------- voz ---------- */
function fillVoices(){
  const L=v=>v.lang.replace('_','-'),p=lang.slice(0,2).toLowerCase();vall=speechSynthesis.getVoices();
  const mine=vall.filter(v=>L(v).slice(0,2).toLowerCase()===p).sort((a,b)=>(L(b)===lang)-(L(a)===lang)),rest=vall.filter(v=>!mine.includes(v));
  const opt=v=>'<option value="'+vall.indexOf(v)+'">'+esc(v.name)+' ('+L(v)+')</option>';
  $('#voice').innerHTML=vall.length?(mine.length?'<optgroup label="Idioma do livro">'+mine.map(opt).join('')+'</optgroup>':'')+(rest.length?'<optgroup label="Outros idiomas">'+rest.map(opt).join('')+'</optgroup>':''):'<option value="">Voz padrão do aparelho</option>';
  voice=mine.find(v=>v.name===savedVoice)||mine[0]||null;$('#voice').value=voice?vall.indexOf(voice):'';
}
function chunkEnd(a){let j=a,n=0;while(j<words.length){n++;j++;if(pe.has(j)||n>=30||(n>=3&&/[.!?…:;]["”’)]*$/.test(words[j-1])))break}return j}
function err(m){const x=$('#err');x.textContent=m;x.hidden=!m}
function speakChunk(){
  if(!playing)return;if(cur>=words.length){pause();return}
  const my=token,a=cur,b=chunkEnd(a),offs=[];let text='';
  for(let k=a;k<b;k++){offs.push(text.length);text+=words[k]+' '}
  const u=new SpeechSynthesisUtterance(text);u.lang=lang;u.rate=rate;if(voice)u.voice=voice;
  u.onstart=()=>{if(my===token){clearTimeout(st);err('');mark(a)}};
  u.onboundary=e=>{if(my!==token||(e.name&&e.name!=='word'))return;let k=0;while(k+1<offs.length&&offs[k+1]<=e.charIndex)k++;cur=a+k;mark(cur)};
  u.onend=()=>{if(my!==token)return;cur=b;save();speakChunk()};
  u.onerror=e=>{if(my!==token||e.error==='interrupted'||e.error==='canceled')return;pause();err('A voz do navegador não respondeu ('+e.error+'). Toque em ▶ de novo. Se continuar, abra o link direto no Chrome (Android) ou no Safari (iPhone).')};
  clearTimeout(st);st=setTimeout(()=>{if(playing&&my===token)err('A voz ainda não começou. Confira o volume e o modo silencioso do celular, ou escolha outra voz.')},4000);
  speechSynthesis.speak(u);
}
function play(){
  if(!words.length)return;playing=true;token++;speechSynthesis.cancel();ui();
  try{if(!ka){ka=new Audio(silent());ka.loop=true}ka.play().catch(()=>{})}catch(e){}
  wake();speakChunk();
}
function pause(){clearTimeout(st);playing=false;token++;speechSynthesis.cancel();if(ka)ka.pause();unwake();save();ui()}
function seek(i,go){cur=Math.max(0,Math.min(words.length-1,i));mark(cur);if(go||playing)play();else save()}
function skip(d){
  let p=paras.findIndex(x=>cur<x.e);if(p<0)p=paras.length-1;
  const t=d>0?Math.min(p+1,paras.length-1):(cur-paras[p].s>8?p:Math.max(p-1,0));seek(paras[t].s)
}
function ui(){
  $('#play').textContent=playing?'⏸':'▶';$('#play').setAttribute('aria-label',playing?'Pausar':'Ouvir');
  if('mediaSession' in navigator){navigator.mediaSession.playbackState=playing?'playing':'paused';
    try{navigator.mediaSession.metadata=new MediaMetadata({title:book.name,artist:book.author||'Leitor em voz alta',album:'Leitor em voz alta',artwork:book.cover?[{src:book.cover,sizes:'512x512',type:(book.cover.match(/^data:([^;]+)/)||[])[1]||'image/jpeg'}]:[]})}catch(e){}}
}
function silent(){const n=8000,b=new ArrayBuffer(44+n),v=new DataView(b),w=(o,s)=>{for(let i=0;i<s.length;i++)v.setUint8(o+i,s.charCodeAt(i))};
  w(0,'RIFF');v.setUint32(4,36+n,true);w(8,'WAVEfmt ');v.setUint32(16,16,true);v.setUint16(20,1,true);v.setUint16(22,1,true);v.setUint32(24,8000,true);v.setUint32(28,8000,true);v.setUint16(32,1,true);v.setUint16(34,8,true);w(36,'data');v.setUint32(40,n,true);new Uint8Array(b,44).fill(128);
  return URL.createObjectURL(new Blob([b],{type:'audio/wav'}))}
async function wake(){try{if(awake&&playing&&navigator.wakeLock&&!wl){wl=await navigator.wakeLock.request('screen');wl.onrelease=()=>{wl=null}}}catch(e){}}

function save(){try{localStorage.setItem('lv:'+book.key,JSON.stringify({cur,rate,lang,voice:voice?voice.name:''}))}catch(e){}}

if('mediaSession' in navigator)for(const [a,f] of [['play',play],['pause',pause],['previoustrack',()=>skip(-1)],['nexttrack',()=>skip(1)],['seekbackward',()=>skip(-1)],['seekforward',()=>skip(1)]])try{navigator.mediaSession.setActionHandler(a,f)}catch(e){}

async function load(f){
  if(!f)return;$('#msg').textContent='Abrindo o livro…';

    const buf=await f.arrayBuffer(),epub=/\.epub$/i.test(f.name)||f.type==='application/epub+zip';

    book={name:(r.title||'').trim()||f.name.replace(/\.[^.]+$/,''),key:f.name+f.size,cover:r.cover||'',author:r.author||''};build(r.paras);
    pages=r.pages;
    if(!pages.length){let acc=0;paras.forEach((p,i)=>{if(i===0||acc>=300){pages.push({n:pages.length+1,para:i});acc=0}acc+=p.e-p.s})}
    curPg=-1;pgAt=new Map();pages.forEach((p,k)=>pgAt.set(p.para,k));pgW=pages.map(p=>paras[p.para].s);
    $('#grid').innerHTML=pages.map((p,k)=>'<button data-k="'+k+'">'+p.n+'</button>').join('');
    const chs=r.chapters.map(c=>c.page?{t:c.t,d:c.d,para:(pages.find(p=>p.n>=c.page)||{}).para}:c).filter(c=>c.para!=null&&c.t);
    $('#chl').innerHTML=chs.length?chs.map(c=>'<button data-w="'+paras[c.para].s+'" style="padding-left:'+(.6+c.d*1.1)+'rem">'+esc(c.t)+'</button>').join(''):'<p class="note">Este livro não tem capítulos marcados.</p>';
    sv={};try{sv=JSON.parse(localStorage.getItem('lv:'+book.key)||'{}')}catch(e){}
    lang=sv.lang||normLang(r.lang)||detect();savedVoice=sv.voice||'';
    rate=sv.rate||1;$('#spd').value=String(rate);fillVoices();$('#seek').max=words.length-1;
    cur=Math.min(sv.cur||0,words.length-1);
    const na='Não informado',t=esc(book.name),m=Math.round(words.length/150),dur='≈ '+(m>=60?Math.floor(m/60)+' h '+(m%60)+' min':m+' min');
    $('#info').innerHTML='<div class="bk"><div class="cv">'+(r.cover?'<img alt="Capa do livro" src="'+r.cover+'">':'<span>'+t+'</span>')+'</div><div class="dt"><h2>'+t+'</h2><dl><dt>Autor</dt><dd>'+esc(r.author||na)+'</dd><dt>Publicação</dt><dd>'+esc(fd(r.date)||na)+'</dd><dt>Edição</dt><dd>'+esc(r.edition||na)+'</dd><dt>Tempo de leitura</dt><dd>'+dur+'</dd></dl><p><button class="btn" id="start">Iniciar leitura</button></p><p><button class="lnk" id="other">Escolher outro arquivo</button></p></div></div>';
    $('#start').onclick=()=>{show('reader');mark(cur);ui()};$('#other').onclick=home;
    $('#msg').textContent='';show('info');
  }catch(e){$('#msg').textContent=e.message||'Não consegui abrir este arquivo.'}
}
</script>
</body>
</html>
